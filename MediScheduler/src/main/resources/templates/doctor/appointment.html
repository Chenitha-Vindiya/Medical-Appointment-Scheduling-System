<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Appointment - MediScheduler</title>
    <link rel="stylesheet" th:href="@{/css/doctor/appointment.css}"/>
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z'/%3E%3C/svg%3E">
</head>
<body>

<!-- Scroll to Top Button -->
<button id="scrollTopBtn" title="Go to top">▲</button>

<script>
    //Scroll to Top Button
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
        if (window.scrollY > 75) {
            scrollTopBtn.classList.add('show');
        } else {
            scrollTopBtn.classList.remove('show');
        }
    });

    scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>

<!-- HEADER -->
<header class="header-wrapper">
    <nav class="navbar">
        <div class="user-profile">
            <span class="material-symbols-outlined logo-icon">stethoscope</span>
            <span class="logo-text" th:text="'Welcome, Dr. ' + ${session.loggedInDoctor.lastName}">Welcome, Doctor</span>
        </div>

        <!-- Hamburger (mobile) -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a th:href="@{/doctor/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/doctor/appointment}">Appointments</a></li>
            <li><a th:href="@{/doctor/patient}">Patient</a></li>
            <li><a th:href="@{/doctor/payment}">Payment</a></li>
            <li><a th:href="@{/doctor/feedback}">Feedback</a></li>
            <li><a th:href="@{/doctor/profile}">Profile</a></li>
            <li>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                    <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
                </button>
            </li>
            <li><button class="btn-primary" onclick="window.location.href='/logout'">Logout</button></li>
        </ul>
    </nav>
</header>

<main>
    <div class="timeline-container">
        <div class="timeline-header">
            <div class="date-navigator">
                <a th:href="@{/doctor/appointment(date=${prevDate})}" class="nav-btn">
                    <span class="material-symbols-outlined">chevron_left</span>
                </a>

                <div class="date-display">
                    <h3 th:text="${isToday} ? 'Today Timeline' : ${#temporals.format(selectedDate, 'EEEE, MMM dd')}">
                        Today Timeline
                    </h3>
                </div>

                <a th:href="@{/doctor/appointment(date=${nextDate})}" class="nav-btn">
                    <span class="material-symbols-outlined">chevron_right</span>
                </a>
            </div>

            <a th:if="${!isToday}" th:href="@{/doctor/appointment}" class="today-jump">Back to Today</a>
        </div>
        <!-- Day View -->
        <div class="view-content active" id="view-day">
            <div class="schedule-list">

                <div th:if="${!bookedAppointments.isEmpty()}">

                    <div th:each="booking : ${bookedAppointments}" class="schedule-item">

                        <div class="time-label">
                            <span class="hour" th:text="${#temporals.format(booking.startTime, 'hh:mm')}">09:00</span>
                            <span class="period" th:text="${#temporals.format(booking.startTime, 'a')}">AM</span>
                        </div>

                        <div class="timeline-marker"
                             th:classappend="${booking.status == 'IN_PROGRESS'} ? 'orange' :
                                            (${booking.status == 'ARRIVED'} ? 'slate' : '')">
                        </div>

                        <div style="width: 100%;">
                            <div class="appointment-card" th:classappend="${booking.status.toLowerCase()}">
                                <img class="patient-avatar"
                                     th:src="'https://ui-avatars.com/api/?name=' + ${booking.patient.firstName} + '+' + ${booking.patient.lastName} + '&background=random'"/>

                                <div class="patient-info">
                                    <h4 class="patient-name" th:text="${booking.patient.firstName} + ' ' + ${booking.patient.lastName}">Name</h4>
                                    <p class="appointment-details" th:text="${booking.reason} + ' • 30 mins'">Reason</p>
                                </div>

                                <span class="status-pill" th:classappend="${booking.status.toLowerCase()}" th:text="${booking.status}">Status</span>
                                <button class="card-actions"><span class="material-symbols-outlined">more_vert</span></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${bookedAppointments.isEmpty()}" class="no-work-msg">
                    <p>No appointments scheduled for this day.</p>
                </div>

            </div>
        </div>
    </div>
</main>

<script>
    // Mobile hamburger menu
    const btn = document.getElementById('hamburgerBtn');
    const nav = document.getElementById('navLinks');
    btn.addEventListener('click', () => {
        nav.classList.toggle('open');
        btn.classList.toggle('active');
    });

    // Close menu on link click
    nav.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('click', () => {
            nav.classList.remove('open');
            btn.classList.remove('active');
        });
    });

    // Dark mode toggle logic
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    // Check for saved user preference on load
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeIcon.innerText = 'dark_mode'; // Changes icon to moon
    } else {
        themeIcon.innerText = 'light_mode'; // Changes icon to sun
    }

    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');

        // Update icon text and save preference
        themeIcon.innerText = isDark ? 'dark_mode' : 'light_mode';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
</script>

</body>
</html>
