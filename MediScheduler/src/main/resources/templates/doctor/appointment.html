                        </div>
                        <div class="room-tag" style="color: var(--primary);">Examination A</div>
                        <span class="status-pill confirmed">Confirmed</span>
                        <button class="card-actions"><span class="material-symbols-outlined">more_vert</span></button>
                    </div>
                </div>
                <div class="schedule-item">
                    <div class="time-label">
                        <span class="hour">09:30</span>
                        <span class="period">AM</span>
                    </div>
                    <div class="timeline-marker inactive"></div>
                    <button class="empty-slot-btn">
                        <span class="material-symbols-outlined">add_circle</span>
                        <span>Available Slot</span>
                    </button>
                </div>
                <div class="schedule-item">
                    <div class="time-label">
                        <span class="hour">10:00</span>
                        <span class="period">AM</span>
                    </div>
                    <div class="timeline-marker orange"></div>
                    <div class="appointment-card in-progress">
                        <img alt="Robert Jenkins" class="patient-avatar"
                             src="https://lh3.googleusercontent.com/aida-public/AB6AXuB129F_TGe0HyOY-Wo8W5s_OKhY4u2RQ-WiAVyUxq0_QdkMwGE9KSG_1vQdAQQ9dq202jjfTrwpTpOvw5oLHvIAeqVttFje4EXADJJHPn4VMqjqGaoWaWlpJ3JV4vYQU7Y_k_LbcRGrdDzGadiBjq5MRX4A_s2qvLxx9ve0xSYCgbeIfSSkD2VV5IPa3agbAcQlYwXoefeRCURGQZZ2YrOSIww235qnd0Vukh2XSkDnvZSZtJf5f_BjI0pyvLqY8rWrMmTKNxfy1sAJ"/>
                        <div class="patient-info">
                            <h4 class="patient-name">Robert Jenkins</h4>
                            <p class="appointment-details">Post-Op Consultation • 45 mins</p>
                        </div>
                        <div class="room-tag" style="color: #92400e;">Recovery Lab</div>
                        <span class="status-pill in-progress">In-Progress</span>
                        <button class="card-actions"><span class="material-symbols-outlined">more_vert</span></button>
                    </div>
                </div>
                <div class="schedule-item">
                    <div class="time-label">
                        <span class="hour">11:00</span>
                        <span class="period">AM</span>
                    </div>
                    <div class="timeline-marker slate"></div>
                    <div class="appointment-card arrived">
                        <img alt="Sarah Williams" class="patient-avatar"
                             src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqfATO0JyQ9ccDTHMpcP7JqI0iegnpKJ5it8sY29WoGoLU2tOc5wXWtgXiwRqjz_0xykfY5kVjApLWVintMLC8P9heXpZFBANuY4xIW6DkQiLhWkCi5XmzL2mOdR_gWiPzeKGiBJDwWMKcf1IqKfefvgsNeQyTslTBF-qojxTV-fGZRuRl2gajaOmIhifj5YhkeMuoy3BW-d5uClLP9rarRMPBrGMS6JJk8xHJm7RcFZIaIoLuiI0DKSWwQnyImf3li11NdV3Wp8CE"/>
                        <div class="patient-info">
                            <h4 class="patient-name">Sarah Williams</h4>
                            <p class="appointment-details">Initial Assessment • 60 mins</p>
                        </div>
                        <div class="room-tag" style="color: #475569;">Consult Room 4</div>
                        <span class="status-pill arrived">Arrived</span>
                        <button class="card-actions"><span class="material-symbols-outlined">more_vert</span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // View Switcher logic
        const switcherButtons = document.querySelectorAll('.view-switcher button');
        const views = {
            day: document.getElementById('view-day'),
            week: document.getElementById('view-week'),
            month: document.getElementById('view-month')
        };
        const viewTitle = document.getElementById('view-title');
        const headerDate = document.getElementById('header-date');
        const welcomeText = document.getElementById('welcome-text');
        const welcomeSubtext = document.getElementById('welcome-subtext');

        switcherButtons.forEach(button => {
            button.addEventListener('click', () => {
                const selectedView = button.getAttribute('data-view');

                switcherButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                Object.values(views).forEach(view => view.classList.remove('active'));
                views[selectedView].classList.add('active');

                switch (selectedView) {
                    case 'day':
                        viewTitle.textContent = 'Appointment Timeline';
                        headerDate.textContent = 'Monday, Oct 23';
                        welcomeText.textContent = 'Good morning, Dr. Clinical.';
                        welcomeSubtext.textContent = 'You have 12 appointments scheduled for today. Your first patient is arriving in 15 minutes.';
                        break;
                    case 'week':
                        viewTitle.textContent = 'Weekly Schedule';
                        headerDate.textContent = 'Oct 23 - Oct 29, 2023';
                        welcomeText.textContent = 'Your Week at a Glance';
                        welcomeSubtext.textContent = 'You have 48 total appointments scheduled for this week. 85% capacity reached.';
                        break;
                    case 'month':
                        viewTitle.textContent = 'Monthly Planner';
                        headerDate.textContent = 'October 2023';
                        welcomeText.textContent = 'October Overview';
                        welcomeSubtext.textContent = 'A total of 184 patients scheduled this month. Next available slot is Nov 2nd.';
                        break;
                }
            });
        });
    });
</script>
</body>
</html>
