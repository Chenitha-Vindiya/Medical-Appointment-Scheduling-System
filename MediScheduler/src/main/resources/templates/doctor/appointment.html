<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Appointment - MediScheduler</title>
    <link rel="stylesheet" th:href="@{/css/doctor/appointment.css}"/>
    <link rel="stylesheet" th:href="@{/css/doctor/fragments/doctor-header.css}">

    <script th:src="@{/js/doctor/fragments/doctor-header.js}" defer></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z'/%3E%3C/svg%3E">
</head>
<body>

<div th:replace="~{doctor/fragments/doctor-header :: header-nav('Manage Appointments', 'appointment', 'calendar_month')}"></div>

<main>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div class="timeline-container">
        <div class="timeline-header">
            <div class="date-navigator">
                <a th:href="@{/doctor/appointment(date=${prevDate})}" class="nav-btn">
                    <span class="material-symbols-outlined">chevron_left</span>
                </a>

                <div class="date-display">
                    <h3 th:text="${isToday} ? 'Today Timeline' : ${#temporals.format(selectedDate, 'EEEE, MMM dd')}">
                        Today Timeline
                    </h3>
                </div>

                <a th:href="@{/doctor/appointment(date=${nextDate})}" class="nav-btn">
                    <span class="material-symbols-outlined">chevron_right</span>
                </a>
            </div>

            <a th:if="${!isToday}" th:href="@{/doctor/appointment}" class="today-jump">Back to Today</a>
        </div>
        <!-- Day View -->
        <div class="view-content active" id="view-day">
            <div class="schedule-list">

                <div th:if="${!bookedAppointments.isEmpty()}">

                    <div th:each="booking : ${bookedAppointments}" class="schedule-item">

                        <div class="time-label">
                            <span class="hour" th:text="${#temporals.format(booking.startTime, 'hh:mm')}">09:00</span>
                            <span class="period" th:text="${#temporals.format(booking.startTime, 'a')}">AM</span>
                        </div>

                        <div class="timeline-marker" th:classappend="${#strings.toLowerCase(booking.status)}"></div>

                        <div style="width: 100%; cursor: pointer;">
                            <div class="appointment-card"
                                 th:classappend="${booking.status.toLowerCase()}"
                                 th:attr="data-id=${booking.id},
                                      data-status=${booking.status},
                                      data-loc=${booking.location},
                                      data-pname=${booking.patient.firstName + ' ' + booking.patient.lastName},
                                      data-pphone=${booking.patient.phoneNumber},
                                      data-pemail=${booking.patient.email},
                                      data-paddr=${booking.patient.homeAddress},
                                      data-date=${#temporals.format(booking.appointmentDate, 'dd MMM yyyy') + ' at ' + #temporals.format(booking.startTime, 'hh:mm a')},
                                      data-reason=${booking.reason},
                                      data-raw-time=${booking.appointmentDate + 'T' + booking.startTime}"
                                 onclick="openDoctorModal(this)">

                                <img class="patient-avatar"
                                     th:src="'https://ui-avatars.com/api/?name=' + ${booking.patient.firstName} + '+' + ${booking.patient.lastName} + '&background=random'"/>

                                <div class="patient-info">
                                    <h4 class="patient-name"
                                        th:text="${booking.patient.firstName} + ' ' + ${booking.patient.lastName}">
                                        Name</h4>

                                    <p class="appointment-details">
                                        <span th:text="${booking.reason} + ' • 30 mins'">Reason</span>
                                        <span th:if="${booking.location != null and booking.location != 'null' and booking.location != ''}"
                                              th:text="' • ' + ${booking.location}"> • Room</span>
                                    </p>
                                </div>

                                <div class="card-middle-note" th:if="${booking.status == 'COMPLETED'}" onclick="event.stopPropagation();">

                                    <div class="note-edit-state" th:style="${booking.history == null or booking.history.extraNote == null} ? 'display: flex;' : 'display: none;'">
                                        <form class="inline-note-form" th:action="@{/doctor/history/note/save}" method="post" onsubmit="saveNoteInline(event, this)">
                                            <input type="hidden" name="appointmentId" th:value="${booking.id}" />
                                            <input type="text" name="extraNote" class="inline-note-input" placeholder="Type clinical note..."
                                                   th:value="${booking.history?.extraNote}" required />

                                            <button type="submit" class="btn-save-note">Save</button>

                                            <button type="button" class="icon-btn btn-cancel-note" onclick="cancelNoteEdit(this)"
                                                    th:style="${booking.history?.extraNote != null} ? 'display: flex;' : 'display: none;'">
                                                <span class="material-symbols-outlined">close</span>
                                            </button>
                                        </form>
                                    </div>

                                    <div class="note-view-state" th:style="${booking.history != null and booking.history.extraNote != null} ? 'display: flex;' : 'display: none;'">
                                        <span class="material-symbols-outlined note-icon">clinical_notes</span>
                                        <p class="rendered-note-text" th:text="${booking.history?.extraNote}"></p>

                                        <div class="note-actions">
                                            <button type="button" class="icon-btn edit-btn" onclick="toggleNoteEdit(this)" title="Edit Note">
                                                <span class="material-symbols-outlined">edit</span>
                                            </button>
                                            <button type="button" class="icon-btn delete-btn" onclick="deleteNoteInline(this)" title="Delete Note">
                                                <span class="material-symbols-outlined">delete</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <span class="status-pill" th:classappend="${booking.status.toLowerCase()}"
                                      th:text="${booking.status}">Status</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${bookedAppointments.isEmpty()}" class="no-work-msg">
                    <p>No appointments scheduled for this day.</p>
                </div>

            </div>
        </div>
    </div>
</main>

<div id="doctorModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header-blue">
            <h2>Manage Appointment</h2>
        </div>
        <form th:action="@{/doctor/appointment/update-status}" method="post" class="modal-form">
            <input type="hidden" name="appointmentId" id="docAppId">

            <div class="info-section">
                <label>PATIENT DETAILS</label>
                <p id="docPatientName" style="font-weight: 600;"></p>
                <p id="docPatientContact" style="font-size: 0.85rem; color: var(--slate-500);"></p>
                <p id="docPatientAddress" style="font-size: 0.85rem; color: var(--slate-500);"></p>
            </div>

            <div class="info-section section-divider">
                <label>APPOINTMENT</label>
                <p id="docAppDateTime" style="font-size: 0.85rem;"></p>
                <p id="docAppReason" style="font-size: 0.75rem;"></p>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="status" id="statusSelect" class="modal-select">
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="PENDING">Pending</option>
                    <option value="CANCELLED">Cancelled</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label>Room / Location</label>
                <input type="text" name="location" id="docLocation" class="modal-select" placeholder="e.g. Room 101">
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeDoctorModal()">Cancel</button>
                <button type="submit" class="btn-confirm">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ==========================================
    // INLINE CLINICAL NOTE LOGIC
    // ==========================================
    function saveNoteInline(e, formNode) {
        e.preventDefault();
        const btn = formNode.querySelector('.btn-save-note');
        const originalText = btn.innerText;
        btn.innerText = 'Saving...';
        btn.disabled = true;

        const formData = new URLSearchParams(new FormData(formNode));
        const newText = formNode.querySelector('.inline-note-input').value;

        fetch(formNode.action, {
            method: 'POST',
            body: formData,
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' }
        }).then(res => {
            if (res.ok) {
                const container = formNode.closest('.card-middle-note');
                const viewState = container.querySelector('.note-view-state');
                const editState = container.querySelector('.note-edit-state');

                // Apply text to the display element
                viewState.querySelector('.rendered-note-text').innerText = newText;

                // Ensure Cancel button is visible for future edits
                const cancelBtn = editState.querySelector('.btn-cancel-note');
                if (cancelBtn) cancelBtn.style.display = 'flex';

                // Swap views instantly
                editState.style.display = 'none';
                viewState.style.display = 'flex';
            } else {
                alert("Failed to save the note. Please try again.");
            }
        }).catch(err => console.error(err))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
    }

    function toggleNoteEdit(btnNode) {
        const container = btnNode.closest('.card-middle-note');
        container.querySelector('.note-view-state').style.display = 'none';
        const editState = container.querySelector('.note-edit-state');
        editState.style.display = 'flex';
        editState.querySelector('.inline-note-input').focus();
    }

    function cancelNoteEdit(btnNode) {
        const container = btnNode.closest('.card-middle-note');
        container.querySelector('.note-edit-state').style.display = 'none';
        container.querySelector('.note-view-state').style.display = 'flex';
    }

    function deleteNoteInline(btnNode) {
        if(!confirm("Are you sure you want to permanently delete this clinical note?")) return;

        const container = btnNode.closest('.card-middle-note');
        const formNode = container.querySelector('form');
        const appointmentId = formNode.querySelector('input[name="appointmentId"]').value;

        btnNode.disabled = true;
        btnNode.style.color = "var(--danger)";

        const formData = new URLSearchParams();
        formData.append('appointmentId', appointmentId);

        fetch('/doctor/history/note/delete', {
            method: 'POST',
            body: formData,
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' }
        }).then(res => {
            if (res.ok) {
                const viewState = container.querySelector('.note-view-state');
                const editState = container.querySelector('.note-edit-state');

                // Swap views back to the empty input field
                viewState.style.display = 'none';
                editState.style.display = 'flex';

                // Clear out the input field and hide cancel button
                editState.querySelector('.inline-note-input').value = '';
                const cancelBtn = editState.querySelector('.btn-cancel-note');
                if (cancelBtn) cancelBtn.style.display = 'none';
            } else {
                alert("Failed to delete the note.");
            }
        }).finally(() => {
            btnNode.disabled = false;
            btnNode.style.color = "";
        });
    }

    // Update your existing window click listener to close both modals
    window.addEventListener('click', (e) => {
        const docModal = document.getElementById('doctorModal');
        if (e.target === docModal) closeDoctorModal();
    });

    function openDoctorModal(element) {
        const modal = document.getElementById('doctorModal');

        // Extract data
        const id = element.getAttribute('data-id');
        const status = element.getAttribute('data-status');
        const loc = element.getAttribute('data-loc');
        const pName = element.getAttribute('data-pname');
        const pPhone = element.getAttribute('data-pphone');
        const pEmail = element.getAttribute('data-pemail');
        const pAddr = element.getAttribute('data-paddr');
        const appDate = element.getAttribute('data-date');
        const reason = element.getAttribute('data-reason');

        // NEW: Extract the exact raw date/time for our calculation
        const rawTime = element.getAttribute('data-raw-time');

        // Set values
        document.getElementById('docAppId').value = id;
        document.getElementById('statusSelect').value = status;
        document.getElementById('docLocation').value = (loc === 'null' || !loc) ? '' : loc;

        // Fill Read-Only fields with Null-Safety
        document.getElementById('docPatientName').innerText = pName || 'N/A';
        document.getElementById('docPatientContact').innerText = (pPhone || 'N/A') + ' | ' + (pEmail || 'N/A');

        // Check if Address is literally "null" or empty
        document.getElementById('docPatientAddress').innerText = (pAddr === 'null' || !pAddr) ? 'No address provided' : pAddr;

        document.getElementById('docAppDateTime').innerText = appDate;
        document.getElementById('docAppReason').innerText = reason;

// ==========================================
        // TIME-BASED READ-ONLY & STATUS LOGIC
        // ==========================================
        // NEW: Enhanced Lock Logic
        if (rawTime) {
            const appStart = new Date(rawTime);
            const appEnd = new Date(appStart.getTime() + (30 * 60000)); // Start + 30 mins
            const now = new Date();

            const statusSelect = document.getElementById('statusSelect');
            const locInput = document.getElementById('docLocation');
            const saveBtn = document.querySelector('.btn-confirm');

            // If "now" is past the appointment start time, lock it
            if (now >= appStart) {
                // LOCK IT DOWN
                statusSelect.style.pointerEvents = 'none';
                statusSelect.style.opacity = '0.6';
                locInput.readOnly = true;
                locInput.style.opacity = '0.6';
                saveBtn.style.display = 'none';
            } else {
                // FUTURE: Keep editable
                statusSelect.style.pointerEvents = 'auto';
                statusSelect.style.opacity = '1';
                locInput.readOnly = false;
                locInput.style.opacity = '1';
                saveBtn.style.display = 'inline-block';

                // Disable 'COMPLETED' for future appointments
                const completedOpt = Array.from(statusSelect.options).find(o => o.value === 'COMPLETED');
                if (completedOpt) completedOpt.disabled = true;
            }
        }
        // ==========================================

        modal.style.display = 'flex';
        modal.classList.add('show-flex');
    }

    function closeDoctorModal() {
        const modal = document.getElementById('doctorModal');
        modal.style.display = 'none';
        modal.classList.remove('show-flex');
    }

    // Close when clicking the dark background
    window.addEventListener('click', (e) => {
        const modal = document.getElementById('doctorModal');
        if (e.target === modal) {
            closeDoctorModal();
        }
    });

    // Mobile hamburger menu
    const btn = document.getElementById('hamburgerBtn');
    const nav = document.getElementById('navLinks');
    btn.addEventListener('click', () => {
        nav.classList.toggle('open');
        btn.classList.toggle('active');
    });

    // Close menu on link click
    nav.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('click', () => {
            nav.classList.remove('open');
            btn.classList.remove('active');
        });
    });

    // Dark mode toggle logic
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    // Check for saved user preference on load
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeIcon.innerText = 'dark_mode'; // Changes icon to moon
    } else {
        themeIcon.innerText = 'light_mode'; // Changes icon to sun
    }

    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');

        // Update icon text and save preference
        themeIcon.innerText = isDark ? 'dark_mode' : 'light_mode';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
</script>

</body>
</html>
