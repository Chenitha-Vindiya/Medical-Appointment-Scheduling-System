<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Feedback - MediScheduler</title>
    <link rel="stylesheet" th:href="@{/css/patient/feedback.css}">
    <link rel="stylesheet" th:href="@{/css/patient/fragments/patient-header.css}">

    <script th:src="@{/js/patient/fragments/patient-header.js}" defer></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z'/%3E%3C/svg%3E">

</head>
<body>

<div th:replace="~{patient/fragments/patient-header :: header-nav('Feedback & Reviews', 'feedback', 'reviews')}"></div>

<main class="container">
    <div class="actions-bar">
        <button class="btn-primary" id="openModal">
            <span class="material-symbols-outlined">add</span>
            New Feedback
        </button>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="feedback-list">
        <div th:each="f : ${feedbackList}" class="feedback-card">
            <div class="card-header">
                <div>
                <span th:each="type : ${#strings.arraySplit(f.feedbackType, ',')}"
                      class="badge"
                      th:classappend="${'badge-' + #strings.toLowerCase(#strings.trim(type))}"
                      th:text="${type}">Type</span>
                    <h3 class="card-title" th:text="${f.subject}">Subject</h3>
                </div>
                <span class="card-date" th:text="${#temporals.format(f.createdAt, 'MMM dd, yyyy')}">Date</span>
            </div>

            <div class="provider-info">
                <div class="provider-details">
                    <p th:text="'Regarding: ' + ${f.appointment.reason}">Reason</p>
                    <p th:text="'With: Dr. ' + ${f.appointment.doctor.lastName}">Doctor</p>

                    <p class="appointment-meta">
                        <span th:text="${#temporals.format(f.appointment.appointmentDate, 'MMM dd, yyyy')}">Date</span>
                        &nbsp;•&nbsp;
                        <span th:text="${#temporals.format(f.appointment.startTime, 'hh:mm a')}">Time</span>
                    </p>
                </div>
            </div>

            <div class="card-content" th:text="${f.content}">
                Feedback content goes here.
            </div>

            <div class="card-actions">
                <button class="btn-action btn-edit"
                        th:data-id="${f.id}"
                        th:data-appointment="${f.appointment.reason}"
                        th:data-subject="${f.subject}"
                        th:data-content="${f.content}"
                        onclick="openEditModal(this)">
                    <span class="material-symbols-outlined">edit</span> Edit
                </button>

                <form th:action="@{/patient/feedback/delete}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this feedback?');">
                    <input type="hidden" name="feedbackId" th:value="${f.id}"/>
                    <button type="submit" class="btn-action btn-delete">
                        <span class="material-symbols-outlined">delete</span> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<!--Edit Feedback Model-->
<div class="modal-overlay" id="editModalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Feedback</h2>
            <button class="close-btn" id="cancelEditBtn" type="button">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form th:action="@{/patient/feedback/update}" method="post">
            <input type="hidden" name="id" id="editId"/>

            <div class="form-group">
                <label class="form-label">Appointment</label>
                <input class="form-input" id="editAppointment" readonly />
            </div>
            <div class="form-group">
                <label class="form-label">Subject</label>
                <input class="form-input" id="editSubject" readonly />
            </div>

            <div class="form-group">
                <label class="form-label">Feedback Type</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input name="feedbackTypes" type="checkbox" value="Question"/> Question</label>
                    <label class="checkbox-item"><input name="feedbackTypes" type="checkbox" value="Compliment"/> Compliment</label>
                    <label class="checkbox-item"><input name="feedbackTypes" type="checkbox" value="Concern"/> Concern</label>
                    <label class="checkbox-item"><input name="feedbackTypes" type="checkbox" value="Suggestion"/> Suggestion</label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Detailed Feedback</label>
                <textarea name="content" id="editContent" class="form-textarea" required rows="4"></textarea>
            </div>

            <button type="submit" class="btn-primary">Save Changes</button>
        </form>
    </div>
</div>

<!-- Feedback Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Share Feedback</h2>
            <button class="close-btn" id="closeModal">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form th:action="@{/patient/feedback/submit}" method="post">
            <div class="form-group">
                <label class="form-label">Appointment</label>
                <select name="appointmentId" class="form-select" required>
                    <option disabled selected value="">Select an option</option>
                    <option th:each="appt : ${appointments}"
                            th:value="${appt.id}"
                            th:text="${'REC-' + appt.id + ' - ' + appt.reason + ' (' + appt.status + ')'}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Subject</label>
                <input name="subject" class="form-input" placeholder="e.g., Appointment experience" required
                       type="text"/>
            </div>

            <div class="form-group">
                <label class="form-label">Feedback Type</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Question"/> Question
                    </label>
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Compliment"/> Compliment
                    </label>
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Concern"/> Concern
                    </label>
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Suggestion"/> Suggestion
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Detailed Feedback</label>
                <textarea name="content" class="form-textarea"
                          placeholder="Please describe your experience in detail..." required rows="4"></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancelModal" type="button">Cancel</button>
                <button class="btn-primary btn-submit" type="submit">Submit Feedback</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEditModal(button) {
        const id = button.getAttribute('data-id');
        const appt = button.getAttribute('data-appointment');
        const subject = button.getAttribute('data-subject');
        const content = button.getAttribute('data-content');

        const modal = document.getElementById('editModalOverlay');
        const form = modal.querySelector('form');

        form.querySelector('input[name="id"]').value = id;
        document.getElementById('editAppointment').value = appt;
        document.getElementById('editSubject').value = subject;
        document.getElementById('editContent').value = content;

        // Use .active so it matches your existing CSS display rules
        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // Prevent background scroll
    }

    // Update your close buttons to remove 'active'
    document.getElementById('cancelEditBtn').addEventListener('click', () => {
        document.getElementById('editModalOverlay').classList.remove('active');
        document.body.style.overflow = '';
    });

    const modal = document.getElementById('modalOverlay');
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');
    const cancelBtn = document.getElementById('cancelModal');
    const form = document.getElementById('feedbackForm');

    const toggleModal = (show) => {
        if (show) {
            modal.style.display = 'flex';
            // Small delay to trigger CSS transition
            setTimeout(() => {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }, 10);
        } else {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            // Wait for transition before hiding
            setTimeout(() => {
                if (!modal.classList.contains('active')) {
                    modal.style.display = 'none';
                }
            }, 300);
        }
    };

    openBtn.addEventListener('click', () => toggleModal(true));
    closeBtn.addEventListener('click', () => toggleModal(false));
    cancelBtn.addEventListener('click', () => toggleModal(false));

    modal.addEventListener('click', (e) => {
        if (e.target === modal) toggleModal(false);
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const submitBtn = form.querySelector('.btn-submit');
        const originalText = submitBtn.innerHTML;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-symbols-outlined">sync</span> Submitting...';

        setTimeout(() => {
            alert('Thank you! Your feedback has been submitted successfully.');
            toggleModal(false);
            form.reset();
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }, 800);
    });

</script>
</body>
</html>
