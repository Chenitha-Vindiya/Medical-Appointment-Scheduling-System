<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Feedback - MediScheduler</title>
    <link rel="stylesheet" th:href="@{/css/patient/feedback.css}">
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z'/%3E%3C/svg%3E">

</head>
<body>

<!-- Scroll to Top Button -->
<button id="scrollTopBtn" title="Go to top">▲</button>

<script>
    //Scroll to Top Button
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
        if (window.scrollY > 75) {
            scrollTopBtn.classList.add('show');
        } else {
            scrollTopBtn.classList.remove('show');
        }
    });

    scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>

<!-- HEADER -->
<header class="header-wrapper">
    <nav class="navbar">
        <div class="user-profile">
            <span class="material-symbols-outlined logo-icon">patient_list</span>
            <span class="logo-text">Feedback</span>
        </div>

        <!-- Hamburger (mobile) -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a th:href="@{/patient/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/patient/appointment}">Appointments</a></li>
            <li><a th:href="@{/patient/history}">History</a></li>
            <li><a th:href="@{/patient/payment}">Payment</a></li>
            <li><a th:href="@{/patient/feedback}">Feedback</a></li>
            <li><a th:href="@{/patient/profile}">Profile</a></li>
            <li>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                    <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
                </button>
            </li>
            <li>
                <button class="btn-logout" onclick="window.location.href='/logout'">Logout</button>
            </li>
        </ul>
    </nav>
</header>

<main class="container">
    <div class="actions-bar">
        <button class="btn-primary" id="openModal">
            <span class="material-symbols-outlined">add</span>
            New Feedback
        </button>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="feedback-list">
        <div th:each="f : ${feedbackList}" class="feedback-card">
            <div class="card-header">
                <div>
                <span th:each="type : ${#strings.arraySplit(f.feedbackType, ',')}"
                      class="badge"
                      th:classappend="${'badge-' + #strings.toLowerCase(#strings.trim(type))}"
                      th:text="${type}">Type</span>
                    <h3 class="card-title" th:text="${f.subject}">Subject</h3>
                </div>
                <span class="card-date" th:text="${#temporals.format(f.createdAt, 'MMM dd, yyyy')}">Date</span>
            </div>

            <div class="provider-info">
                <div class="provider-details">
                    <p th:text="'Regarding: ' + ${f.appointment.reason}">Reason</p>
                    <p th:text="'With: Dr. ' + ${f.appointment.doctor.lastName}">Doctor</p>
                </div>
            </div>

            <div class="card-content" th:text="${f.content}">
                Feedback content goes here.
            </div>

            <div class="card-actions">
                <button class="btn-action btn-edit">
                    <span class="material-symbols-outlined">edit</span> Edit
                </button>

                <form th:action="@{/patient/feedback/delete}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this feedback?');">
                    <input type="hidden" name="feedbackId" th:value="${f.id}"/>
                    <button type="submit" class="btn-action btn-delete">
                        <span class="material-symbols-outlined">delete</span> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<!-- Feedback Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Share Feedback</h2>
            <button class="close-btn" id="closeModal">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form th:action="@{/patient/feedback/submit}" method="post">
            <div class="form-group">
                <label class="form-label">Appointment</label>
                <select name="appointmentId" class="form-select" required>
                    <option disabled selected value="">Select an option</option>
                    <option th:each="appt : ${appointments}"
                            th:value="${appt.id}"
                            th:text="${'REC-' + appt.id + ' - ' + appt.reason + ' (' + appt.status + ')'}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Subject</label>
                <input name="subject" class="form-input" placeholder="e.g., Appointment experience" required
                       type="text"/>
            </div>

            <div class="form-group">
                <label class="form-label">Feedback Type</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Question"/> Question
                    </label>
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Compliment"/> Compliment
                    </label>
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Concern"/> Concern
                    </label>
                    <label class="checkbox-item">
                        <input name="feedbackTypes" type="checkbox" value="Suggestion"/> Suggestion
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Detailed Feedback</label>
                <textarea name="content" class="form-textarea"
                          placeholder="Please describe your experience in detail..." required rows="4"></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancelModal" type="button">Cancel</button>
                <button class="btn-primary btn-submit" type="submit">Submit Feedback</button>
            </div>
        </form>
    </div>
</div>

<script>
    const modal = document.getElementById('modalOverlay');
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');
    const cancelBtn = document.getElementById('cancelModal');
    const form = document.getElementById('feedbackForm');

    const toggleModal = (show) => {
        if (show) {
            modal.style.display = 'flex';
            // Small delay to trigger CSS transition
            setTimeout(() => {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }, 10);
        } else {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            // Wait for transition before hiding
            setTimeout(() => {
                if (!modal.classList.contains('active')) {
                    modal.style.display = 'none';
                }
            }, 300);
        }
    };

    openBtn.addEventListener('click', () => toggleModal(true));
    closeBtn.addEventListener('click', () => toggleModal(false));
    cancelBtn.addEventListener('click', () => toggleModal(false));

    modal.addEventListener('click', (e) => {
        if (e.target === modal) toggleModal(false);
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const submitBtn = form.querySelector('.btn-submit');
        const originalText = submitBtn.innerHTML;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-symbols-outlined">sync</span> Submitting...';

        setTimeout(() => {
            alert('Thank you! Your feedback has been submitted successfully.');
            toggleModal(false);
            form.reset();
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }, 800);
    });

    // Mobile hamburger menu
    const btn = document.getElementById('hamburgerBtn');
    const nav = document.getElementById('navLinks');
    btn.addEventListener('click', () => {
        nav.classList.toggle('open');
        btn.classList.toggle('active');
    });

    // Close menu on link click
    nav.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('click', () => {
            nav.classList.remove('open');
            btn.classList.remove('active');
        });
    });

    // Dark mode toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeIcon.innerText = 'dark_mode';
    }
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        themeIcon.innerText = isDark ? 'dark_mode' : 'light_mode';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });


</script>
</body>
</html>
