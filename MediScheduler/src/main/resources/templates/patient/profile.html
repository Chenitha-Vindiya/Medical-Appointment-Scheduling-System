<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Patient Profile Settings - MediScheduler</title>
    <link rel="stylesheet" th:href="@{/css/patient/profile.css}">
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z'/%3E%3C/svg%3E">

</head>

<body class="page-body">

    <!-- Scroll to Top Button -->
    <button id="scrollTopBtn" title="Go to top">▲</button>

    <script>
        //Scroll to Top Button
        const scrollTopBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 75) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>

    <!-- HEADER -->
    <header class="header-wrapper">
        <nav class="navbar">
            <div class="user-profile">
                <span class="material-symbols-outlined logo-icon">patient_list</span>
                <span class="logo-text">Patient Profile</span>
            </div>

            <!-- Hamburger (mobile) -->
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a th:href="@{/patient/dashboard}">Dashboard</a></li>
                <li><a th:href="@{/patient/appointment}">Appointments</a></li>
                <li><a th:href="@{/patient/history}">History</a></li>
                <li><a th:href="@{/patient/billing}">Billing</a></li>
                <li><a th:href="@{/patient/feedback}">Feedback</a></li>
                <li><a th:href="@{/patient/profile}">Profile</a></li>
                <!-- <li><a href="#portals">Portals</a></li>
        <li><a href="#" onclick="event.preventDefault()">Support</a></li> -->
                <!-- <li><button class="btn-login" onclick="window.location.href='login.html'">Login</button></li> -->
                <li><button class="btn-primary" onclick="window.location.href='/logout'">Logout</button></li>
            </ul>
        </nav>
    </header>

    <div id="successToast" th:if="${param.updated}" class="toast-notification">
        <div class="toast-content">
            <span class="material-symbols-outlined toast-icon">check_circle</span>
            <div class="toast-message">
                <span class="toast-title">Success</span>
                <p>Your profile has been updated successfully.</p>
            </div>
        </div>
        <button class="toast-close" onclick="closeToast()">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="toast-progress"></div>
    </div>

    <main class="main-content" data-purpose="main-content">
        <form class="profile-form" th:action="@{/patient/update-profile}" method="post">
            <input type="hidden" name="id" th:value="${patient.id}" />

            <section class="form-card" data-purpose="personal-info">
                <h3 class="section-title">Personal Information</h3>
                <div class="personal-info-container">
                    <div class="profile-pic-section">
                        <div class="avatar-container group">
                            <img alt="Profile avatar" class="avatar-image"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqaYjdEhET8sXxvpjdkhjU3R1yxYDgebclNKNg7Agexdt_rfFyTGPHljIYDSNum0SEmQWqOqh0K4WCwbWOwxk8aKRzZefPJMFdyfRBW6nJJ1bIoZWul33WEF4L0Mu9FONBeXJ9j_Nt5weFrMqCrfTFrWtut87WOS2DFw8gyTz5akzleySl8wGKv8_7kvPOQIgXGg0TxlvtIsEKfwXFgiZhSa56tuqHhxkTvkEFNy-Ub0kHhvh5PPIKeRNdA0Q9OJuCeqMkOFUL9rla" />
                            <div class="avatar-overlay">
                                <svg class="camera-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                                    <path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="2"></path>
                                </svg>
                            </div>
                        </div>
                        <button class="change-photo-btn" type="button">Change Photo</button>
                    </div>
                    <div class="fields-grid">
                        <div class="input-group">
                            <label class="input-label">Full Name</label>
                            <input class="form-input" name="fullName" type="text" th:value="${patient.fullName}" />
                        </div>
                        <div class="input-group">
                            <label class="input-label">Date of Birth</label>
                            <input class="form-input" name="dateOfBirth" type="date" th:value="${patient.dateOfBirth}" />
                        </div>
                        <div class="input-group">
                            <label class="input-label">Gender</label>
                            <select class="form-input" name="gender">
                                <option th:selected="${patient.gender == 'Male'}">Male</option>
                                <option th:selected="${patient.gender == 'Female'}">Female</option>
                                <option th:selected="${patient.gender == 'Other'}">Other</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="input-label">National ID</label>
                            <input class="form-input" name="nationalId" type="text" th:value="${patient.nationalId}" />
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-card" data-purpose="contact-details">
                <h3 class="section-title">Contact Details</h3>
                <div class="contact-grid">
                    <div class="input-group">
                        <label class="input-label">Email Address</label>
                        <input class="form-input" name="email" type="email" th:value="${patient.email}" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Phone Number</label>
                        <input class="form-input" name="phoneNumber" type="tel" th:value="${patient.phoneNumber}" />
                    </div>
                    <div class="input-group full-width">
                        <label class="input-label">Home Address</label>
                        <textarea class="form-input" name="homeAddress" rows="3" th:text="${patient.homeAddress}"></textarea>
                    </div>
                </div>
            </section>

            <section class="form-card" data-purpose="emergency-contact">
                <h3 class="section-title">Emergency Contact</h3>
                <div class="emergency-grid">
                    <div class="input-group">
                        <label class="input-label">Contact Name</label>
                        <input class="form-input" name="emergencyContactName" type="text" th:value="${patient.emergencyContactName}" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Relationship</label>
                        <input class="form-input" name="relationship" type="text" th:value="${patient.relationship}" />
                    </div>
                    <div class="input-group">
                        <label class="input-label">Phone Number</label>
                        <input class="form-input" name="emergencyPhone" type="tel" th:value="${patient.emergencyPhone}" />
                    </div>
                </div>
            </section>

            <section class="form-card" data-purpose="security-settings">
                <h3 class="section-title">Security</h3>
                <div class="security-grid">
                    <div class="input-group">
                        <label class="input-label">New Password</label>
                        <input class="form-input" name="password" type="password" />
                    </div>
                </div>
            </section>

            <footer class="form-actions">
                <button class="btn btn-cancel" type="button">Cancel</button>
                <button class="btn btn-save" type="submit">Save Changes</button>
            </footer>
        </form>
    </main>

        <script>
        // Mobile hamburger menu
        const btn = document.getElementById('hamburgerBtn');
        const nav = document.getElementById('navLinks');
        btn.addEventListener('click', () => {
            nav.classList.toggle('open');
            btn.classList.toggle('active');
        });

        // Close menu on link click
        nav.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', () => {
                nav.classList.remove('open');
                btn.classList.remove('active');
            });
        });

        function closeToast() {
            const toast = document.getElementById('successToast');
            if (toast) {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }
        }

        // Auto-close after 4 seconds
        if (document.getElementById('successToast')) {
            setTimeout(closeToast, 4000);
        }
    </script>
</body>

</html>
